# Upstox instrument mapping & AI Multi-Agent Advisory Configuration.
#
# NOTE: no code currently loads this file, and ConfigLoader.load_yaml performs no environment
# expansion. Credentials therefore CANNOT be supplied here. UpstoxClient reads UPSTOX_API_KEY and
# UPSTOX_ACCESS_TOKEN from the process environment only; see .env.example.
#
# The former "${UPSTOX_API_KEY}" / "${UPSTOX_ACCESS_TOKEN}" placeholders were removed because a
# never-expanded placeholder in a tracked file invites a live secret into version control.
upstox:
  redirect_uri: "https://127.0.0.1:5000"
  instruments:
    INFY: "NSE_EQ|INE009A01021"
    TCS: "NSE_EQ|INE467B01029"
    RELIANCE: "NSE_EQ|INE002A01018"
    HDFCBANK: "NSE_EQ|INE040A01034"
    ICICIBANK: "NSE_EQ|INE090A01021"

ai_advisors:
  enabled: true
  require_consensus: true
  claude:
    enabled: true
    cli_command: "claude"
    role: "Macro & Qualitative Risk"
  codex:
    enabled: true
    cli_command: "codex"
    role: "Strategy & Parameter Invariants"
  antigravity:
    enabled: true
    cli_command: "agy"
    role: "Multi-Agent Consensus & Position Sizing"
