# Pre-trade Risk Limits and Governor Parameters
global_limits:
  max_portfolio_leverage: 1.0        # 1.0 = No leverage / Long-only cash, >1.0 = Margin
  max_position_weight: 0.25          # Maximum 25% allocation in any single instrument
  max_daily_drawdown_pct: 0.03       # 3% max daily loss halt (Kill switch)
  max_total_drawdown_pct: 0.10       # 10% trailing max drawdown halt
  max_open_orders: 10
  min_cash_buffer_pct: 0.05          # Retain at least 5% unallocated cash

options_limits:
  max_portfolio_delta: 200.0         # Net directional exposure cap
  max_portfolio_gamma: 50.0
  max_portfolio_vega: 5000.0         # Volatility exposure cap
  allow_naked_short_options: false   # Strictly require spread or hedged structures
  max_contracts_per_order: 50        # Lot limit

slippage_and_spread:
  max_allowed_spread_pct: 0.015      # 1.5% maximum allowable bid-ask spread
  default_equity_slippage_bps: 5.0   # 5 bps equity slippage
  default_options_slippage_bps: 20.0 # 20 bps option premium slippage
