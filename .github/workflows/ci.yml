# QuantOS repository gates.
#
# Every command here is one this repository already runs by hand, at the same strictness. The
# point of CI is not to invent standards but to stop a green claim resting on someone having
# remembered to run them.
#
# Windows is the build target (the release artifact is a PyInstaller Windows x64 bundle), so the
# gates run on windows-latest rather than a cheaper Linux runner that would not represent it.
#
# Why these are separate jobs
# ---------------------------
# They were one job, seven gates deep, sharing a single 30-minute budget in series. That has two
# failure modes and the repository has now hit both:
#
#   - `ruff format` is cheap and ran second, so when it went red for a week in 2026-09 everything
#     after it was skipped and *no tests ran at all* -- while the gate looked merely lint-red.
#   - The suite grew until the job finished within ~34 seconds of the timeout. Run 34839894115,
#     which changed one Markdown file, was killed at 30m10s during the reverse-order step, skipping
#     the craft checkers and the claim/disk audits behind it.
#
# Both are the same defect: one slow or failing gate silently cancels the verification behind it, and
# a skipped gate reads like a passing one to anything summarising the run. Splitting gives each gate
# its own budget and its own verdict, and they run concurrently, so wall-clock is the slowest job
# rather than the sum. `gates` at the bottom aggregates them into one status check.

name: gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static gates
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies from the lock file
        # --frozen fails if uv.lock and pyproject disagree, which is the point: a build whose
        # dependencies were resolved fresh is not the build that was tested.
        run: uv sync --frozen --extra dev
        env:
          UV_PROJECT_ENVIRONMENT: .venv

      # These three no longer gate the test run. A formatting slip is now a red `static` beside a
      # green `tests`, instead of a red gate that quietly ran nothing.
      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        if: always()
        run: uv run ruff format --check .

      - name: Strict mypy
        if: always()
        run: uv run mypy src launcher.py scripts

  tests:
    name: Tests (${{ matrix.order }} order)
    runs-on: windows-latest
    timeout-minutes: 30

    strategy:
      # Both orders always run, even when one fails: "green forwards, red backwards" is a specific
      # and useful diagnosis, and fail-fast would hide half of it.
      fail-fast: false
      matrix:
        order: [forward, reverse]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies from the lock file
        run: uv sync --frozen --extra dev
        env:
          UV_PROJECT_ENVIRONMENT: .venv

      - name: Tests, ${{ matrix.order }} file order
        # Reverse order catches tests that only pass because an earlier test left state behind.
        # A suite that is green forwards and red backwards is not green.
        shell: pwsh
        run: |
          if ('${{ matrix.order }}' -eq 'reverse') {
            $files = Get-ChildItem tests/test_*.py | Sort-Object Name -Descending | ForEach-Object { $_.FullName }
            uv run pytest @files -q
          } else {
            uv run pytest tests/ -q
          }

  craft:
    name: Craft checkers and audits
    runs-on: windows-latest
    timeout-minutes: 15

    # Needs neither Python nor the locked environment: the checkers are Node, the audits are
    # PowerShell over Git. Skipping the uv sync is most of why this job is minutes rather than tens.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Craft checker self-tests
        # The checkers gate the repository, so a broken checker is a silent gate failure.
        run: |
          node scripts/check-code.mjs --self-test
          node scripts/check-tests.mjs --self-test

      - name: Agent claim and disk layout audits
        if: always()
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/audit-agent-claims.ps1
          powershell -ExecutionPolicy Bypass -File scripts/audit-disk-layout.ps1

  gates:
    name: gates
    needs: [static, tests, craft]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # One status check that means "every gate above actually ran and passed", so branch protection
    # has a single name to require and a skipped job cannot be mistaken for a passing one. `always()`
    # is what makes that true: without it this job would itself be skipped when a dependency failed,
    # and a skipped required check does not block.
    steps:
      - name: Verify every gate passed
        shell: bash
        run: |
          echo "static : ${{ needs.static.result }}"
          echo "tests  : ${{ needs.tests.result }}"
          echo "craft  : ${{ needs.craft.result }}"
          if [ "${{ needs.static.result }}" != "success" ] \
            || [ "${{ needs.tests.result }}" != "success" ] \
            || [ "${{ needs.craft.result }}" != "success" ]; then
            echo "::error::One or more gates did not succeed."
            exit 1
          fi
          echo "All gates passed."
