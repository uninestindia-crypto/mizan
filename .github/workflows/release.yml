name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic version bump type (patch, minor, major) or "current"'
        required: false
        default: 'current'
        type: choice
        options:
          - current
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies from lockfile
        run: uv sync --frozen --extra dev
        env:
          UV_PROJECT_ENVIRONMENT: .venv

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Apply Version Bump (if requested via workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bump_type != 'current'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/publish-github-release.ps1 -BumpType "${{ github.event.inputs.bump_type }}" -OnlyBumpVersion
          $ver = .venv\Scripts\python.exe -c "from quant_system import __version__; print(__version__)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/quant_system/__init__.py
          git commit -m "release: bump version to v$ver"
          git tag -a "v$ver" -m "QuantOS Release v$ver"
          git push origin main
          git push origin "v$ver"
          echo "BUMPED_TAG=v$ver" >> $env:GITHUB_ENV

      - name: Determine Target Version and Tag
        id: meta
        shell: pwsh
        run: |
          $ver = .venv\Scripts\python.exe -c "from quant_system import __version__; print(__version__)"
          $tag = if ($env:BUMPED_TAG) { $env:BUMPED_TAG } elseif ($env:GITHUB_REF_NAME -match '^v\d') { $env:GITHUB_REF_NAME } else { "v$ver" }
          Write-Host "Releasing version: $ver (Tag: $tag)"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build Windows Release Bundle & Installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-windows-release.ps1 -Clean

      - name: Verify Clean Release Gates
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/verify-clean-release.ps1

      - name: Generate Release Notes & Checksums
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $distDir = Join-Path $PWD "dist"
          $files = Get-ChildItem -Path $distDir -File | Where-Object { $_.Name -match '\.(exe|zip|json)$' }
          $checksumLines = foreach ($f in $files) {
              $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
              "- ``$($f.Name)`` (SHA-256: ``$hash``, Size: $([math]::Round($f.Length / 1MB, 2)) MB)"
          }

          # The fingerprint file the app's "Update and restart" button checks the installer against.
          $sumLines = foreach ($f in $files) {
              "$((Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)"
          }
          Set-Content -Path (Join-Path $distDir "SHA256SUMS-$tag.txt") -Value ($sumLines -join "`n") -Encoding ascii

          $notes = @"
          # QuantOS Release $tag

          Automated institutional-grade Windows release package for QuantOS.

          ## Release Artifacts
          $($checksumLines -join "`n")

          ## Verification & Integrity
          - **All 9 clean release verification gates passed 100%**
          - **Zero C: drive leakage** (100% drive-isolated local execution)
          - **Immutable Evidence Preservation** guaranteed across installs, restarts, and uninstalls
          - **Software Bill of Materials (SBOM)** bound directly to cryptographic identity of ``uv.lock``
          - **Cryptographic Release Manifest** verifying packaged distribution payloads
          "@

          Set-Content -Path (Join-Path $distDir "RELEASE_NOTES.md") -Value $notes -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: QuantOS ${{ steps.meta.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.json
            dist/SHA256SUMS-*.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
