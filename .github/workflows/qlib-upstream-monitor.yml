name: Upstream Qlib Monitor

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-upstream:
    name: Check Microsoft Qlib Releases
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run Upstream Qlib Watcher
        run: uv run python scripts/watch_upstream_qlib.py

      - name: Commit state or ticket if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/upstream/ agent_context/work/inbox/
          git diff --staged --quiet || git commit -m "chore(upstream): sync microsoft/qlib state and agent ticket [skip ci]"
          git push || echo "No changes or push skipped"
