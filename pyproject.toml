[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-system"
version = "2.0.1"
description = "Institutional-grade, modular quantitative trading, backtesting, and risk management system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    # Native window for the desktop app (Windows WebView2). Optional at runtime: quantos_studio.py
    # falls back to an Edge/Chrome app window when it cannot be imported.
    "pywebview>=5.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-PyYAML>=6.0.12.20240314",
    "httpx>=0.27.0",
    "pyinstaller>=6.5.0",
    # Audit and advisory SDKs, used only by scripts/ - never by the trading, training, or
    # execution paths. Deliberately not in [project.dependencies]: the shipped platform must not
    # carry two LLM SDKs it never calls.
    "anthropic>=1.4.0",
    "openai>=3.11.0",
]


[tool.hatch.build.targets.wheel]
packages = ["src/quant_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -v --basetemp=tmp/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agents", ".venv", ".pytest_cache", "build", "dist", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501"]


[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "vulture>=2.16",
]
